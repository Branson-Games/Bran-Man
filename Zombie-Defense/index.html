        // 1. Grouped Scrap: Update handleCanvasTap
        function handleCanvasTap(clientX, clientY) {
            unlockAudio();
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const tapX = clientX - rect.left;
            const tapY = clientY - rect.top;

            // Updated to collect all items in radius
            for (let i = collectables.length - 1; i >= 0; i--) {
                const item = collectables[i];
                if (Math.hypot(tapX - item.x, tapY - item.y) < 60) {
                    scrap += item.amount;
                    score += 10;
                    playSfx('bloop');
                    collectables.splice(i, 1);
                }
            }
            scrapDisplay.textContent = scrap;
            scoreDisplay.textContent = score;
            updateShopButtons();
            
            // ... (Continue with original turret placement code)
        }

        // 2. Difficulty Scaling: Update generateWaveData
        function generateWaveData() {
            zombiesToSpawn = [];
            spawnCountdown = 40;
            // Wave/Boss Scaling: 
            const difficultyMultiplier = 1 + (Math.floor(currentWave / 5) * 0.2);
            const count = (6 + currentWave * 5) * difficultyMultiplier;
            for (let i = 0; i < count; i++) {
                // ... (Original zombie logic with scaled stats)
                zombiesToSpawn.push({
                    type: (currentWave >= 3 && Math.random() > 0.7) ? 'tank' : 'normal',
                    hp: Math.floor((4 + (currentWave * 0.5)) * difficultyMultiplier),
                    speed: 0.85
                });
            }
        }

        // 3. Copter Cost: Update triggerBrancopter
        function triggerBrancopter(event) {
            // ... (Original event logic)
            const BRANCOPTER_SCRAP_COST = 150;
            if (!gameActive || scrap < BRANCOPTER_SCRAP_COST) return;
            scrap -= BRANCOPTER_SCRAP_COST;
            scrapDisplay.textContent = scrap;
