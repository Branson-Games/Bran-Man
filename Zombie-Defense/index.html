        // 1. GROUPED SCRAP COLLECTION
        function handleCanvasTap(clientX, clientY) {
            unlockAudio();
            if (!gameActive) return;

            const rect = canvas.getBoundingClientRect();
            const tapX = clientX - rect.left;
            const tapY = clientY - rect.top;

            // Logic to collect all scrap within radius
            let collectedAmount = 0;
            for (let i = collectables.length - 1; i >= 0; i--) {
                const item = collectables[i];
                if (Math.hypot(tapX - item.x, tapY - item.y) < 60) {
                    collectedAmount += item.amount;
                    collectables.splice(i, 1);
                }
            }

            if (collectedAmount > 0) {
                scrap += collectedAmount;
                scrapDisplay.textContent = scrap;
                playSfx('bloop');
                updateShopButtons();
                return;
            }

            // ... [Keep original turret placement logic below here]
        }

        // 2. DIFFICULTY SCALING
        function generateWaveData() {
            zombiesToSpawn = [];
            spawnCountdown = 40;
            // Increased scaling factor based on currentWave
            const count = 6 + (currentWave * 5); 
            for (let i = 0; i < count; i++) {
                zombiesToSpawn.push({
                    type: (currentWave > 2 && Math.random() > 0.7) ? 'tank' : 'normal',
                    hp: 4 + Math.floor(currentWave * 0.5),
                    speed: 0.85 + (currentWave * 0.02)
                });
            }
        }

        // 3. COPTER COST (Scrap instead of Points)
        function triggerBrancopter(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            unlockAudio();

            const COPTER_COST = 150;
            if (!gameActive || scrap < COPTER_COST) return;

            scrap -= COPTER_COST;
            scrapDisplay.textContent = scrap;
