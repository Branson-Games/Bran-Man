<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAN-MAN: Zombie Farm Defender</title>
    <style>
        body { margin: 0; background: #050a05; overflow: hidden; font-family: monospace; user-select: none; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        #hud { display: flex; justify-content: space-between; padding: 15px; background: #0a140a; border-bottom: 4px solid #55ff55; color: #fff; }
        #game-canvas { flex-grow: 1; background: #0a1c0a; touch-action: none; }
        #control-panel { padding: 15px; background: #020502; border-top: 4px solid #55ff55; display: flex; gap: 10px; }
        .btn { padding: 15px; background: #ffaa00; cursor: pointer; font-weight: bold; border: none; flex: 1; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.95); color: #55ff55; z-index: 10; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div>Scrap: <span id="scrap">100</span></div>
            <div>Base HP: <span id="hp">100</span>%</div>
            <div>Wave: <span id="wave">1</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="control-panel">
            <button class="btn" id="build-btn">PLACE TURRET (50)</button>
            <button class="btn" id="copter-btn">COPTER (150 Scrap)</button>
        </div>
        <div id="start-screen" class="overlay">
            <h1>ZOMBIE DEFENDER</h1>
            <p>Defend the farm from the right!</p>
            <button class="btn" id="start-btn">START DEFENSE</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let scrap = 100, hp = 100, wave = 1, gameActive = false, collectables = [];
    
    // Audio Context
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        osc.frequency.value = freq;
        g.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // Logic: Scrap Collection (Grouped)
    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left, ty = e.clientY - rect.top;
        for (let i = collectables.length - 1; i >= 0; i--) {
            if (Math.hypot(tx - collectables[i].x, ty - collectables[i].y) < 50) {
                scrap += 25;
                collectables.splice(i, 1);
                playSfx(600);
            }
        }
        document.getElementById('scrap').textContent = scrap;
    });

    // Logic: Difficulty Scaling & Copter
    document.getElementById('copter-btn').addEventListener('click', () => {
        if (scrap >= 150) {
            scrap -= 150;
            playSfx(200);
            document.getElementById('scrap').textContent = scrap;
        }
    });

    function getWaveMultiplier() { return 1 + (Math.floor(wave / 5) * 0.2); }

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').classList.add('hidden');
        gameActive = true;
        requestAnimationFrame(loop);
    });

    function loop() {
        if (!gameActive) return;
        // Game render and update logic using getWaveMultiplier()
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
