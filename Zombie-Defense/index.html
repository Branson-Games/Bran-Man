<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAN-MAN: Zombie Farm Defender</title>
    <style>
        body { margin: 0; padding: 0; background: #050a05; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        #hud { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: rgba(10, 20, 10, 0.9); border-bottom: 4px solid #55ff55; color: #fff; }
        #game-canvas { flex-grow: 1; background: #0a1c0a; touch-action: none; }
        #control-panel { background: #020502; border-top: 4px solid #55ff55; padding: 15px; display: flex; gap: 10px; }
        .shop-btn { flex: 1; padding: 10px; text-align: center; font-weight: bold; cursor: pointer; border: 4px solid #000; }
        #btn-turret { background: #ffaa00; color: #000; }
        #btn-brancopter { background: #55ffff; color: #000; }
        .disabled { opacity: 0.4; pointer-events: none; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 12, 5, 0.94); color: white; z-index: 10; }
        .btn-action { padding: 15px 30px; font-size: 1.5rem; background: #ffaa00; border: 4px solid #000; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div>⚙️ Scrap: <span id="scrap">100</span></div>
            <div>🛡️ Base HP: <span id="base-hp">100</span>%</div>
            <div>🧟 Wave: <span id="wave">1</span></div>
            <div>🏆 Pts: <span id="score">0</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="control-panel">
            <div id="btn-turret" class="shop-btn">🛠️ TURRET (50)</div>
            <div id="btn-brancopter" class="shop-btn">🛸 COPTER (150 Scrap)</div>
        </div>
        <div id="start-screen" class="overlay">
            <h1>ZOMBIE DEFENDER</h1>
            <button id="start-btn" class="btn-action">START DEFENSE</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const BRANCOPTER_COST_SCRAP = 150;
    
    let scrap = 100, score = 0, baseHp = 100, currentWave = 1;
    let turrets = [], zombies = [], projectiles = [], collectables = [], animations = [];
    let gameActive = false, isPlacingTurret = false;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSfx(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        const freqs = { 'bloop': 440, 'crunch': 100, 'laser': 300, 'brancopter': 80 };
        osc.frequency.value = freqs[type] || 440;
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function collectScrap(tapX, tapY) {
        let collected = false;
        for (let i = collectables.length - 1; i >= 0; i--) {
            let item = collectables[i];
            if (Math.hypot(tapX - item.x, tapY - item.y) < 60) {
                scrap += item.amount;
                score += 10;
                collectables.splice(i, 1);
                collected = true;
            }
        }
        if (collected) {
            playSfx('bloop');
            updateUI();
        }
        return collected;
    }

    function updateUI() {
        document.getElementById('scrap').textContent = scrap;
        document.getElementById('score').textContent = score;
        document.getElementById('wave').textContent = currentWave;
        document.getElementById('base-hp').textContent = baseHp;
        document.getElementById('btn-brancopter').classList.toggle('disabled', scrap < BRANCOPTER_COST_SCRAP);
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const tx = e.clientX - rect.left, ty = e.clientY - rect.top;
        
        if (collectScrap(tx, ty)) return;
        // ... (Turret placement logic)
    });

    document.getElementById('btn-brancopter').addEventListener('click', () => {
        if (scrap >= BRANCOPTER_COST_SCRAP) {
            scrap -= BRANCOPTER_COST_SCRAP;
            playSfx('brancopter');
            updateUI();
            // ... (Copter logic)
        }
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').classList.add('hidden');
        gameActive = true;
        animate();
    });

    function getDifficultyMultiplier() {
        return 1 + (Math.floor(currentWave / 5) * 0.2);
    }

    function animate() {
        if (!gameActive) return;
        // ... (Game loop logic including zombie spawning with getDifficultyMultiplier() scaling)
        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
