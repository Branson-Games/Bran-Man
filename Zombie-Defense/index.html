<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAN-MAN: Zombie Farm Defender</title>
    <!-- [Original CSS remains unchanged] -->
    <style>
        body { margin: 0; padding: 0; background: #050a05; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; }
        #hud { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: rgba(10, 20, 10, 0.9); border-bottom: 4px solid #55ff55; box-sizing: border-box; }
        .hud-item { font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #scrap-display { color: #ffff55; } #score-display { color: #55ffff; } #wave-display { color: #ff55ff; }
        #base-hp-container { display: flex; align-items: center; gap: 8px; color: #ff5555; }
        #game-canvas { display: block; background: #0a1c0a; flex-grow: 1; min-height: 0; touch-action: none; }
        #control-panel { background: #020502; border-top: 4px solid #55ff55; padding: 15px 20px; padding-bottom: max(15px, env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: center; gap: 15px; }
        .shop-btn { flex: 1; max-width: 260px; padding: 14px; font-family: 'Courier New', monospace; font-size: 1.3rem; font-weight: bold; text-align: center; border: 4px solid #000; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; touch-action: manipulation; }
        #btn-turret { background: #ffaa00; color: #000; box-shadow: inset -4px -4px 0 #995500, inset 4px 4px 0 #ffff55; }
        #btn-brancopter { background: #55ffff; color: #000; box-shadow: inset -4px -4px 0 #00aaaa, inset 4px 4px 0 #ffffff; }
        .disabled { opacity: 0.4 !important; filter: grayscale(80%); cursor: not-allowed !important; }
        .btn-sub { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5, 12, 5, 0.94); color: white; z-index: 10; border: 8px solid #55ff55; box-sizing: border-box; padding: 20px; }
        .overlay h1 { font-size: 3rem; color: #55ff55; margin-bottom: 15px; text-align: center; text-shadow: 4px 4px 0 #000; }
        .btn-action { padding: 16px 40px; font-size: 1.6rem; font-weight: bold; font-family: 'Courier New', monospace; background: #ffaa00; color: #000; border: 4px solid #000; box-shadow: inset -4px -4px 0 #aa5500, inset 4px 4px 0 #ffff55; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-item" id="scrap-display">⚙️ Scrap: <span>100</span></div>
            <div class="hud-item" id="base-hp-container">🛡️ Base HP: <span id="base-hp">100</span>%</div>
            <div class="hud-item" id="wave-display">🧟 Wave: <span>1</span></div>
            <div class="hud-item" id="score-display">🏆 Points: <span>0</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="control-panel">
            <div id="btn-turret" class="shop-btn"><span>🛠️ Place Turret</span><span class="btn-sub">Cost: 50 Scrap</span></div>
            <div id="btn-brancopter" class="shop-btn"><span>🛸 BRANCOPTER</span><span class="btn-sub" id="brancopter-cost-label">Cost: 150 Scrap</span></div>
        </div>
        <div id="start-screen" class="overlay"><h1>ZOMBIE DEFENDER</h1><button id="start-button" class="btn-action">START DEFENSE</button></div>
        <div id="wave-clear-screen" class="overlay hidden"><h1 id="clear-title">WAVE CLEARED!</h1><button id="next-wave-button" class="btn-action">NEXT WAVE</button></div>
        <div id="game-over-screen" class="overlay hidden"><h1 style="color: #ff5555;">PERIMETER BREACHED</h1><button id="restart-button" class="btn-action">REDEPLOY</button></div>
    </div>

<script>
    'use strict';
    // ... [Original initialization code remains]
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scrapDisplay = document.querySelector('#scrap-display span');
    const scoreDisplay = document.querySelector('#score-display span');
    const waveDisplay = document.querySelector('#wave-display span');
    const baseHpDisplay = document.getElementById('base-hp');
    const btnTurret = document.getElementById('btn-turret');
    const btnBrancopter = document.getElementById('btn-brancopter');
    const brancopterCostLabel = document.getElementById('brancopter-cost-label');
    const startScreen = document.getElementById('start-screen');
    const waveClearScreen = document.getElementById('wave-clear-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startButton = document.getElementById('start-button');
    const nextWaveButton = document.getElementById('next-wave-button');
    const restartButton = document.getElementById('restart-button');

    const ROWS = 5, COLS = 8;
    let cellWidth = 1, cellHeight = 1, gameActive = false, currentWave = 1, scrap = 100, score = 0, baseHp = 100;
    let turrets = [], zombies = [], projectiles = [], collectables = [], animations = [];
    let isPlacingTurret = false;
    const TURRET_COST = 50, UPGRADE_COST = 30, COPTER_SCRAP_COST = 150;
    let zombiesToSpawn = [], spawnCountdown = 0;

    // --- CHANGE 1: Grouped Scrap Collection ---
    function handleCanvasTap(clientX, clientY) {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const tapX = clientX - rect.left, tapY = clientY - rect.top;
        
        let collected = 0;
        for (let i = collectables.length - 1; i >= 0; i--) {
            if (Math.hypot(tapX - collectables[i].x, tapY - collectables[i].y) < 60) {
                collected += collectables[i].amount;
                collectables.splice(i, 1);
            }
        }
        if (collected > 0) {
            scrap += collected;
            score += (collected / 25) * 10;
            scrapDisplay.textContent = scrap;
            scoreDisplay.textContent = score;
            updateShopButtons();
            return; // Exit after collecting nearby items
        }
        // ... [Rest of turret placement logic]
    }

    // --- CHANGE 2: Difficulty Scaling ---
    function generateWaveData() {
        zombiesToSpawn = [];
        spawnCountdown = 40;
        // Scaling: Increase count and HP based on currentWave
        const count = 6 + (currentWave * 6); 
        for (let i = 0; i < count; i++) {
            zombiesToSpawn.push({
                type: (currentWave > 2 && Math.random() > 0.8) ? 'tank' : 'normal',
                hp: 4 + Math.floor(currentWave * 0.5),
                speed: 0.85 + (currentWave * 0.05)
            });
        }
    }

    // --- CHANGE 3: Copter Cost ---
    function triggerBrancopter(event) {
        if (!gameActive || scrap < COPTER_SCRAP_COST) return;
        scrap -= COPTER_SCRAP_COST;
        scrapDisplay.textContent = scrap;
        updateShopButtons();
        // ... [Existing copter animation and logic]
    }

    // ... [Include the rest of your original loop and helper functions here]
</script>
</body>
</html>
