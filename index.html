<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Miner Dash!</title>
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%232c2c2c'/><path d='M90 30 L140 75 L90 150 L40 75 Z' fill='%2355ffff' stroke='%2300aaaa' stroke-width='8'/><rect x='75' y='55' width='20' height='20' fill='%23ffffff'/></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%232c2c2c'/><path d='M90 30 L140 75 L90 150 L40 75 Z' fill='%2355ffff' stroke='%2300aaaa' stroke-width='8'/><rect x='75' y='55' width='20' height='20' fill='%23ffffff'/></svg>">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #4a7329;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #5c87e7 70%, #4a7329 100%);
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .hud-text {
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
        }

        #score { color: #55ffff; }
        #lives { color: #ff5555; }

        #game-canvas {
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            z-index: 10;
            border: 10px solid #3c3c3c;
            box-sizing: border-box;
        }

        .overlay h1 {
            font-size: 3.5rem;
            color: #55ff55;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 4px 4px 0px #000;
        }

        .overlay p {
            font-size: 1.4rem;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
            text-shadow: 2px 2px 0px #000;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            background: #00aa00;
            color: white;
            border: 4px solid #000;
            box-shadow: inset -4px -4px 0px #005500, inset 4px 4px 0px #55ff55;
            cursor: pointer;
        }

        .btn:hover {
            background: #55ff55;
            color: #000;
            box-shadow: inset -4px -4px 0px #00aa00, inset 4px 4px 0px #ffffff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div class="hud-text">💎 Score: <span id="score">0</span></div>
            <div class="hud-text">❤️ Lives: <span id="lives">3</span></div>
        </div>

        <div id="start-screen" class="overlay">
            <h1>DIAMOND MINER DASH</h1>
            <p>Catch the falling 💎 Diamonds and 🟢 Emeralds!<br><br><span style="color: #ff5555; font-weight: bold;">⚠️ AVOID THE TNT! ⚠️</span></p>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1>GAME OVER</h1>
            <p>You mined <span id="final-score" style="color: #55ffff; font-weight: bold;">0</span> gems!</p>
            <button class="btn" onclick="startGame()">RESPAWN 🔄</button>
        </div>

        <canvas id="game-canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        let gameActive = false;
        let score = 0;
        let lives = 3;
        let items = [];
        let particles = [];
        let spawnTimer = 0;
        let spawnInterval = 50; 
        let gameSpeed = 4;
        let screenShake = 0;

        // Sound System (Built-in Synthesizer)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            
            // Resume context if browser paused it
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'gem') {
                // Happy 8-bit pickup ding
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'tnt') {
                // Explosive crash sound
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'miss') {
                // Disappointment buzz
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(147, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        const chest = { x: 0, y: 0, width: 110, height: 70 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            chest.y = canvas.height - 110;
            if (!gameActive && items.length === 0) {
                chest.x = canvas.width / 2 - chest.width / 2;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function moveChest(e) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            chest.x = clientX - chest.width / 2;
            if (chest.x < 0) chest.x = 0;
            if (chest.x + chest.width > canvas.width) chest.x = canvas.width - chest.width;
        }
        window.addEventListener('mousemove', moveChest);
        window.addEventListener('touchmove', moveChest, { passive: true });

        function startGame() {
            initAudio(); // Activate sound system on button click
            score = 0;
            lives = 3;
            items = [];
            particles = [];
            gameSpeed = 5;
            spawnInterval = 50;
            screenShake = 0;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameActive = true;
            animate();
        }

        function spawnItem() {
            const types = ['diamond', 'diamond', 'emerald', 'tnt'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            items.push({
                x: Math.random() * (canvas.width - 60) + 10,
                y: -40,
                width: 40,
                height: 40,
                type: type,
                speed: gameSpeed + Math.random() * 2
            });
        }

        // Spawn Blocky TNT Particles
        function makeExplosion(x, y) {
            screenShake = 15; // Trigger camera rumble
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 3, // Blast slightly upwards
                    size: Math.random() * 10 + 6,
                    color: ['#ff3333', '#ff9900', '#ffcc00', '#ffffff', '#3c3c3c'][Math.floor(Math.random() * 5)],
                    life: 25 + Math.random() * 15
                });
            }
        }

        function drawChest() {
            ctx.fillStyle = '#8B5A2B';
            ctx.fillRect(chest.x, chest.y, chest.width, chest.height);
            ctx.strokeStyle = '#4A2F15';
            ctx.lineWidth = 6;
            ctx.strokeRect(chest.x + 3, chest.y + 3, chest.width - 6, chest.height - 6);
            ctx.fillStyle = '#4A2F15';
            ctx.fillRect(chest.x, chest.y + 22, chest.width, 6);
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(chest.x + (chest.width / 2) - 8, chest.y + 16, 16, 18);
            ctx.fillStyle = '#555555';
            ctx.fillRect(chest.x + (chest.width / 2) - 4, chest.y + 24, 8, 10);
        }

        function drawItem(item) {
            ctx.save();
            if (item.type === 'diamond') {
                ctx.fillStyle = '#55ffff';
                ctx.beginPath();
                ctx.moveTo(item.x + 20, item.y);
                ctx.lineTo(item.x + 40, item.y + 15);
                ctx.lineTo(item.x + 20, item.y + 40);
                ctx.lineTo(item.x, item.y + 15);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(item.x + 16, item.y + 10, 6, 6);
            } else if (item.type === 'emerald') {
                ctx.fillStyle = '#55ff55';
                ctx.beginPath();
                ctx.moveTo(item.x + 20, item.y);
                ctx.lineTo(item.x + 38, item.y + 10);
                ctx.lineTo(item.x + 38, item.y + 30);
                ctx.lineTo(item.x + 20, item.y + 40);
                ctx.lineTo(item.x + 2, item.y + 30);
                ctx.lineTo(item.x + 2, item.y + 10);
                ctx.closePath();
                ctx.fill();
            } else if (item.type === 'tnt') {
                ctx.fillStyle = '#ff5555';
                ctx.fillRect(item.x, item.y, 40, 40);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(item.x, item.y + 12, 40, 16);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 11px Arial';
                ctx.fillText('TNT', item.x + 7, item.y + 25);
                ctx.fillStyle = '#3c3c3c';
                ctx.fillRect(item.x + 5, item.y, 4, 4);
                ctx.fillRect(item.x + 20, item.y, 4, 4);
                ctx.fillRect(item.x + 30, item.y, 4, 4);
            }
            ctx.restore();
        }

        function checkGameOver() {
            if (lives <= 0) {
                gameActive = false;
                finalScoreEl.textContent = score;
                gameOverScreen.classList.remove('hidden');
            }
        }

        function animate() {
            if (!gameActive) return;

            ctx.save();
            // Screen Shake Effect
            if (screenShake > 0) {
                let dx = (Math.random() - 0.5) * screenShake;
                let dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
                screenShake *= 0.9; // Smoothly calm down the shaking
                if (screenShake < 0.5) screenShake = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Sky background logic within clear
            ctx.fillStyle = '#866043'; 
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = '#578b32'; 
            ctx.fillRect(0, canvas.height - 40, canvas.width, 10);

            drawChest();

            spawnTimer++;
            if (spawnTimer >= spawnInterval) {
                spawnItem();
                spawnTimer = 0;
                if (spawnInterval > 20) spawnInterval -= 0.4;
            }

            // Handle Falling Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                drawItem(item);

                // Collision with Chest
                if (item.y + item.height >= chest.y && 
                    item.y <= chest.y + chest.height &&
                    item.x + item.width >= chest.x && 
                    item.x <= chest.x + chest.width) {
                    
                    items.splice(i, 1);

                    if (item.type === 'tnt') {
                        playSound('tnt');
                        makeExplosion(item.x + 20, item.y + 20);
                        lives--;
                        livesEl.textContent = lives;
                    } else {
                        playSound('gem');
                        score += (item.type === 'emerald') ? 2 : 1;
                        scoreEl.textContent = score;
                        if (score % 6 === 0) gameSpeed += 0.4;
                    }

                    checkGameOver();
                    continue;
                }

                // Hit the ground (Missed gems)
                if (item.y > canvas.height - 40) {
                    items.splice(i, 1);
                    
                    if (item.type !== 'tnt') {
                        playSound('miss');
                        lives--;
                        livesEl.textContent = lives;
                        checkGameOver();
                    }
                }
            }

            // Update & Render Explosion Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size); // Blocky particles

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            ctx.restore();
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
